<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin login</title>
    <link rel="stylesheet" href="admin-login.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-animation" id="bg-animation">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <!-- Mouse Trail Particles -->
      <div class="mouse-particle particle-1" id="p1"></div>
      <div class="mouse-particle particle-2" id="p2"></div>
      <div class="mouse-particle particle-3" id="p3"></div>
      <!-- Dynamic Elements Container -->
      <div id="dynamic-bg-elements"></div>
      <div class="grid-overlay"></div>
    </div>
   <div class="login-container">
  <div class="login-form">
    <h2>Admin Login</h2>

    <form>
      <div class="mb-3">
        <label for="exampleInputEmail1">Email address</label>
        <input
          type="email"
          id="exampleInputEmail1"
        />
        <div id="emailHelp">
          We'll never share your email with anyone else.
        </div>
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1">Password</label>
        <input
          type="password"
          id="exampleInputPassword1"
        />
      </div>

      <div class="mb-3">
        <input type="checkbox" id="exampleCheck1" />
        <label for="exampleCheck1">Check me out</label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
</div>
  
    <script src="script.js"></script>
  </body>
</html>
